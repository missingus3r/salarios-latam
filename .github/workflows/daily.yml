name: Daily salary refresh

on:
  schedule:
    - cron: '17 9 * * *'   # 09:17 UTC = 06:17 -03 daily
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Ingest Sysarmy
        run: python scripts/ingest_sysarmy.py
        continue-on-error: true

      - name: Ingest crowdsource form
        run: python scripts/ingest_form.py
        continue-on-error: true
        env:
          FORM_SHEET_URL: ${{ secrets.FORM_SHEET_URL }}

      - name: Scrape Glassdoor (background, rate-limited)
        run: python scripts/scrape_glassdoor.py
        continue-on-error: true

      - name: Scrape LinkedIn (background, rate-limited)
        run: python scripts/scrape_linkedin.py
        continue-on-error: true

      - name: Aggregate to salaries.json
        run: python scripts/aggregate.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet --staged || git commit -m "chore(data): daily refresh"
          git push || echo "nothing to push"

  deploy-pages:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
